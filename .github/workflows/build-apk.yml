name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # توقيع ثابت اختياري: أضف الأسرار ANDROID_KEYSTORE_BASE64 و ANDROID_KEYSTORE_PASSWORD
      # و ANDROID_KEY_ALIAS و ANDROID_KEY_PASSWORD حتى تُثبَّت التحديثات فوق النسخة السابقة.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ann-news.apk

      # ملف APK ثابت الرابط في صفحة Releases (لا يستهلك حصة تخزين Artifacts).
      - name: Publish APK to the "latest-apk" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          name: ANN – آخر نسخة
          prerelease: true
          make_latest: false
          body: |
            آخر نسخة مبنية تلقائياً.
            الفرع: ${{ github.ref_name }}
            الالتزام: ${{ github.sha }}
            رقم البناء: ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/ann-news.apk

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ann-news-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/ann-news.apk
          retention-days: 30
